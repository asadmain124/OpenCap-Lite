services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opencap
      POSTGRES_PASSWORD: opencap
      POSTGRES_DB: opencap
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencap -d opencap"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Default to the prebuilt image so `docker compose up` works without a
    # local clone. To build from source instead (e.g. when iterating on
    # Dockerfile changes), comment out `image:` and uncomment `build:`.
    image: ghcr.io/asadmain124/opencap-lite:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://opencap:opencap@db:5432/opencap?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-me-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      ENABLE_TELEMETRY: ${ENABLE_TELEMETRY:-false}
    ports:
      - "3000:3000"

volumes:
  pgdata:
