services:
  - type: web
    name: opencap-lite
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    plan: starter
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opencap-lite-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: ENABLE_TELEMETRY
        value: "false"

databases:
  - name: opencap-lite-db
    databaseName: opencap
    user: opencap
    plan: starter
